plugins {
    id 'com.android.application'
}

// Listas de paquetes compartidas con los scripts y la app del teléfono
def generatedAssets = layout.buildDirectory.dir('generated/debloatAssets').get().asFile

tasks.register('copyDebloatAssets', Sync) {
    from(rootProject.file('../debloater/lists')) { into 'lists' }
    into generatedAssets
}
preBuild.dependsOn 'copyDebloatAssets'

// Clave de release de Halo: datos en launcher/keystore.properties (fuera de git). Sin ese archivo
// se firma con la clave de depuración, para que cualquiera pueda compilar e instalar su versión.
def keystoreFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

android {
    namespace 'com.carmelita.halo'
    compileSdk 34

    defaultConfig {
        applicationId 'com.carmelita.halo'
        minSdk 23
        targetSdk 34
        versionCode 14
        versionName '2.4.1'
    }

    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }

    sourceSets {
        main.assets.srcDir generatedAssets
        main.java.srcDir rootProject.file('../shared/java')
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
