plugins {
    id 'com.android.application'
}

// Listas de paquetes compartidas con los scripts y la app del teléfono
def generatedAssets = layout.buildDirectory.dir('generated/debloatAssets').get().asFile

tasks.register('copyDebloatAssets', Sync) {
    from(rootProject.file('../debloater/lists')) { into 'lists' }
    into generatedAssets
}
preBuild.dependsOn 'copyDebloatAssets'

android {
    namespace 'com.carmelita.halo'
    compileSdk 34

    defaultConfig {
        applicationId 'com.carmelita.halo'
        minSdk 23
        targetSdk 34
        versionCode 11
        versionName '2.0.1'
    }

    sourceSets {
        main.assets.srcDir generatedAssets
        main.java.srcDir rootProject.file('../shared/java')
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Firmado con la clave de depuración para que el APK se pueda instalar directamente.
            // Si vas a distribuirlo, crea tu propia keystore.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
