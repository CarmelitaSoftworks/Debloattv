name: Compilar Halo Launcher

on:
  push:
    paths: ['launcher/**', '.github/workflows/build-launcher.yml']
  pull_request:
    paths: ['launcher/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Lint y compilación
        run: ./gradlew --no-daemon lintRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: halo-launcher
          path: launcher/app/build/outputs/apk/release/app-release.apk
