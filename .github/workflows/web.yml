name: Versión web

on:
  push:
    paths: ['web/**', 'debloater/lists/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'debloater/lists/**']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Sintaxis del código
        run: node --check web/adb.js && node --check web/debloat.js
      - name: web/index.html está al día con las listas y el código
        run: |
          python3 web/build.py
          git diff --exit-code web/index.html || { echo "::error::Ejecuta python3 web/build.py y sube web/index.html"; exit 1; }
