name: Compilar APKs

on:
  push:
    paths: ['launcher/**', 'phone/**', 'debloater/lists/**', '.github/workflows/**']
  pull_request:
    paths: ['launcher/**', 'phone/**', 'debloater/lists/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Halo Launcher (TV)
        working-directory: launcher
        run: ./gradlew --no-daemon lintRelease assembleRelease
      - name: DebloatTV (teléfono) con el Halo recién compilado dentro
        run: |
          cp launcher/app/build/outputs/apk/release/app-release.apk dist/halo-launcher.apk
          cd phone && ./gradlew --no-daemon lintRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            launcher/app/build/outputs/apk/release/app-release.apk
            phone/app/build/outputs/apk/release/app-release.apk
