name: Compilar APK

on:
  push:
    paths: ['launcher/**', 'shared/**', 'debloater/lists/**', '.github/workflows/**']
  pull_request:
    paths: ['launcher/**', 'shared/**', 'debloater/lists/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # ubuntu-latest ya trae el Android SDK en $ANDROID_HOME; Gradle descarga lo que falte
      - name: Halo (app universal para TV y teléfono)
        working-directory: launcher
        run: ./gradlew --no-daemon lintRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: halo
          path: launcher/app/build/outputs/apk/release/app-release.apk
