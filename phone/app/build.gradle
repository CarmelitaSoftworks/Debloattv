plugins {
    id 'com.android.application'
}

// Las listas de paquetes y el APK de Halo se empaquetan dentro de la app,
// así no hay que mantener copias: se usan los mismos archivos que los scripts.
def generatedAssets = layout.buildDirectory.dir('generated/debloatAssets').get().asFile

tasks.register('copyDebloatAssets', Copy) {
    from(rootProject.file('../debloater/lists')) { into 'lists' }
    from(rootProject.file('../dist/halo-launcher.apk'))
    into generatedAssets
}
preBuild.dependsOn 'copyDebloatAssets'

android {
    namespace 'com.carmelita.debloattv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.carmelita.debloattv'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    sourceSets {
        main.assets.srcDir generatedAssets
        main.java.srcDir rootProject.file('../shared/java')
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Firmado con la clave de depuración para que el APK se pueda instalar directamente.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
